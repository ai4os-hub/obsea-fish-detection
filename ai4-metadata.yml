metadata_version: 2.0.0
title: OBSEA Fish Detection
summary: AI-based fish detection and classification algorithm based on YOLOv8.
description: "The OBSEA is an underwater observatory that has been acquiring multiparametric data\nsince 2009. Over the years, various cameras have been deployed, resulting in a vast \narchive of pictures dating back to 2011. Historically, this data has been manually \nanalyzed to extract ecological information about the fish community in the area, a \nprocess that is both time-consuming and repetitive.\n\nIn this application, we employed an AI-based fish detection and classification algorithm, \nleveraging YOLOv8, to automate this process. The  model has been finetuned to \ndetect and classify fish at the OBSEA underwater observatory. \n\nTo enhance the model's performance, YOLOv8's (nano, xlarge) built-in data augmentation techniques \nwere utilized. The hyperparameters controlling the data augmentation were optimized \naccording to the guidelines provided in the official documentation.\nThis module is mainly based on this already [existing module](https://github.com/ai4os-hub/ai4os-yolov8-torch)\n\nHere is an example of the model's output:\n\n<img class='fit', src='https://raw.githubusercontent.com/ai4os-hub/obsea-fish-detection/main/image/obsea.png'/>\n  \nYou can find more information on Yolov8 here:\n* https://github.com/ultralytics/ultralytics\n* https://docs.ultralytics.com"
