[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "obsea-drift-detection"
description = "AI-based fish drift detection algorithm based on YOLOv8"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
  "Intended Audience :: Information Technology",
  "Intended Audience :: AI/ML/DL Researchers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dynamic = ["version", "dependencies"]

authors = [{ name = "Borja Esteban", email = "borja.sanchis@kit.edu" }]

[project.urls]
"Homepage" = "https://codebase.helmholtz.cloud/m-team/ai/obsea-fish-detection"
"Bug Tracker" = "https://codebase.helmholtz.cloud/m-team/ai/obsea-fish-detection/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
env = ["DATA_PATH=tests/data", "MODELS_PATH=tests/models"]
addopts = "--import-mode=importlib"

[tool.setuptools]
packages = ["obsea", "obsea.api"]

[tool.setuptools.package-dir]
"obsea" = "obsea"
"obsea.api" = "api"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { file = "VERSION" }

[project.entry-points."deepaas.v2.model"]
obsea = "obsea.api"

[tool.mypy]
ignore_errors = true

[tool.black]
line-length = 120
